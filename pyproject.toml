[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btcpred"
version = "1.0.0"
description = "Second-by-second BTC price predictor: CPU market analyser + GPU 25-minute forecaster"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=14.0", "torch>=2.3"]

[project.optional-dependencies]
live = ["marimo>=0.9", "plotly>=5.20", "websocket-client>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
